name: Data Quality Checks & Experiment Alerts

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python -m pytest tests/

      - name: Ingest Data to DuckDB
        run: python scripts/ingest_to_duckdb.py

      - name: Run dbt Pipeline
        run: |
          dbt run --profiles-dir dbt --project-dir dbt
          dbt test --profiles-dir dbt --project-dir dbt

      - name: Export Data for Tableau
        run: python scripts/export_to_tableau.py

      - name: Run Data Reconciliation
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
          SALESFORCE_SECURITY_TOKEN: ${{ secrets.SALESFORCE_SECURITY_TOKEN }}
        run: python scripts/data_reconciliation.py

      - name: Run Experiment Alerts
        env:
          VWO_API_KEY: ${{ secrets.VWO_API_KEY }}
          VWO_ACCOUNT_ID: ${{ secrets.VWO_ACCOUNT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/experiment_alerts.py
